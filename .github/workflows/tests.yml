name: Python tests and static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser replay behavior tests
        run: |
          node --check web/app.js
          node --test tests/test_web_replay.mjs
      - name: Build static demo
        run: python scripts/build_site.py
      - name: Verify sample is reproducible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from algohunter.core import Config,run_experiment
          sample=json.loads(Path('web/sample.json').read_text())
          actual=run_experiment(Config())
          for row in actual['history']:
              row.pop('generation_genome', None)
              row.pop('generation_score', None)
              row.pop('generation_cross_algorithms', None)
          assert sample == actual, 'Committed sample must match the original fields of the Python run'
          print('Sample matches Python engine')
          PY
